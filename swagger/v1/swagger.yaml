---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/users":
    post:
      summary: registers new users
      tags:
      - Registrations
      parameters: []
      responses:
        '200':
          description: register new user successfully
        '422':
          description: registration failed because user already exists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
